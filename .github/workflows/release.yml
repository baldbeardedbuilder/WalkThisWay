name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x

      - name: Extract and format version from release tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $version = $tag -replace '^v', ''

          # Ensure 4-part version (X.Y.Z.0)
          $parts = $version -split '\.'
          if ($parts.Length -eq 3) {
            $version = "$version.0"
          }

          Write-Host "Version: $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Update Package.appxmanifest version
        shell: pwsh
        run: |
          $manifestPath = "WalkThisWay/Package.appxmanifest"
          $version = "${{ steps.version.outputs.version }}"

          [xml]$manifest = Get-Content $manifestPath
          $manifest.Package.Identity.Version = $version
          $manifest.Save($manifestPath)

          Write-Host "Updated Package.appxmanifest to version $version"

      - name: Restore dependencies
        run: |
          dotnet restore WalkThisWay/WalkThisWay.csproj -r win-x64
          dotnet restore WalkThisWay.Tests/WalkThisWay.Tests.csproj -r win-x64

      - name: Build x64
        run: dotnet build WalkThisWay/WalkThisWay.csproj -c Release -r win-x64 --no-restore

      - name: Build ARM64
        run: dotnet build WalkThisWay/WalkThisWay.csproj -c Release -r win-arm64

      - name: Build tests
        run: dotnet build WalkThisWay.Tests/WalkThisWay.Tests.csproj -c Release -r win-x64 --no-restore

      - name: Run tests
        run: dotnet test WalkThisWay.Tests/WalkThisWay.Tests.csproj -c Release -r win-x64 --no-build

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-output
          path: |
            WalkThisWay/bin/
            WalkThisWay/obj/
            WalkThisWay.Tests/bin/
            WalkThisWay.Tests/obj/
            WalkThisWay/Package.appxmanifest
          retention-days: 1

  package:
    needs: build-and-test
    runs-on: windows-latest

    steps:
      - name: Checkout codecode
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.x

      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build-output

      - name: Restore dependencies
        run: dotnet restore WalkThisWay.slnx

      - name: Publish x64 MSIX
        run: >
          dotnet publish WalkThisWay/WalkThisWay.csproj -c Release -r win-x64
          /p:PublishProfile=win-x64
          /p:AppxPackageSigningEnabled=false

      - name: Publish ARM64 MSIX
        run: >
          dotnet publish WalkThisWay/WalkThisWay.csproj -c Release -r win-arm64
          /p:PublishProfile=win-arm64
          /p:AppxPackageSigningEnabled=false

      - name: Azure login
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          creds: ${{ secrets.AZURE_CREDS }}

      - name: Sign MSIX packages
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: https://eus.codesigning.azure.net/
          signing-account-name: bbb-signing
          certificate-profile-name: BaldBeardedBuilder
          files-folder: ${{ github.workspace }}\WalkThisWay
          files-folder-filter: msix
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify MSIX signatures
        shell: pwsh
        run: |
          $msixFiles = Get-ChildItem -Path "WalkThisWay" -Filter "*.msix" -Recurse

          if ($msixFiles.Count -eq 0) {
            Write-Error "No MSIX packages found!"
            exit 1
          }

          foreach ($file in $msixFiles) {
            Write-Host "Verifying signature on $($file.Name)..."
            $sig = Get-AuthenticodeSignature $file.FullName
            Write-Host "  Status: $($sig.Status)"
            Write-Host "  Signer: $($sig.SignerCertificate.Subject)"
            if ($sig.Status -ne 'Valid') {
              Write-Error "Signature on $($file.Name) is not valid: $($sig.Status)"
              exit 1
            }
          }

          Write-Host "All MSIX packages are signed and verified."

      - name: Upload MSIX artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msix-packages
          path: WalkThisWay/**/*.msix
          retention-days: 7

      - name: Upload MSIX packages to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $msixFiles = Get-ChildItem -Path "WalkThisWay" -Filter "*.msix" -Recurse

          foreach ($file in $msixFiles) {
            Write-Host "Uploading $($file.Name) to release..."
            gh release upload "${{ github.event.release.tag_name }}" "$($file.FullName)" --clobber
          }
