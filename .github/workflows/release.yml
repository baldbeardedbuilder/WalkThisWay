name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Extract and format version from release tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.event.release.tag_name }}"
          $version = $tag -replace '^v', ''

          # Ensure 4-part version (X.Y.Z.0)
          $parts = $version -split '\.'
          if ($parts.Length -eq 3) {
            $version = "$version.0"
          }

          Write-Host "Version: $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Update Package.appxmanifest version
        shell: pwsh
        run: |
          $manifestPath = "WalkThisWay/Package.appxmanifest"
          $version = "${{ steps.version.outputs.version }}"

          [xml]$manifest = Get-Content $manifestPath
          $manifest.Package.Identity.Version = $version
          $manifest.Save($manifestPath)

          Write-Host "Updated Package.appxmanifest to version $version"

      - name: Restore dependencies
        run: |
          dotnet restore WalkThisWay/WalkThisWay.csproj -r win-x64
          dotnet restore WalkThisWay.Tests/WalkThisWay.Tests.csproj -r win-x64

      - name: Build x64
        run: dotnet build WalkThisWay/WalkThisWay.csproj -c Release -r win-x64 --no-restore

      - name: Build ARM64
        run: dotnet build WalkThisWay/WalkThisWay.csproj -c Release -r win-arm64

      - name: Build tests
        run: dotnet build WalkThisWay.Tests/WalkThisWay.Tests.csproj -c Release -r win-x64 --no-restore

      - name: Run tests
        run: dotnet test WalkThisWay.Tests/WalkThisWay.Tests.csproj -c Release -r win-x64 --no-build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            WalkThisWay/bin/
            WalkThisWay/obj/
            WalkThisWay.Tests/bin/
            WalkThisWay.Tests/obj/
            WalkThisWay/Package.appxmanifest
          retention-days: 1

  package:
    needs: build-and-test
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Restore dependencies
        run: dotnet restore WalkThisWay.slnx

      - name: Decode signing certificate
        shell: pwsh
        run: |
          $certBytes = [Convert]::FromBase64String("${{ secrets.SIGNING_CERTIFICATE }}")
          $certPath = Join-Path $env:RUNNER_TEMP "SigningCertificate.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)
          echo "CERT_PATH=$certPath" >> $env:GITHUB_ENV

      - name: Publish x64 MSIX
        run: >
          dotnet publish WalkThisWay/WalkThisWay.csproj -c Release -r win-x64
          /p:PublishProfile=win-x64
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateKeyFile=${{ env.CERT_PATH }}
          /p:PackageCertificatePassword=${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}

      - name: Publish ARM64 MSIX
        run: >
          dotnet publish WalkThisWay/WalkThisWay.csproj -c Release -r win-arm64
          /p:PublishProfile=win-arm64
          /p:AppxPackageSigningEnabled=true
          /p:PackageCertificateKeyFile=${{ env.CERT_PATH }}
          /p:PackageCertificatePassword=${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          if (Test-Path $env:CERT_PATH) { Remove-Item $env:CERT_PATH -Force }

      - name: Find and upload MSIX packages
        shell: pwsh
        run: |
          Write-Host "Searching for MSIX packages..."

          if (Test-Path "WalkThisWay/AppPackages") {
            Write-Host "AppPackages directory contents:"
            Get-ChildItem -Path "WalkThisWay/AppPackages" -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
          } else {
            Write-Host "WalkThisWay/AppPackages directory does not exist"
            Write-Host "Searching entire WalkThisWay directory for .msix files..."
            Get-ChildItem -Path "WalkThisWay" -Filter "*.msix" -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
          }

          $msixFiles = Get-ChildItem -Path "WalkThisWay" -Filter "*.msix" -Recurse

          foreach ($file in $msixFiles) {
            Write-Host "Found MSIX: $($file.FullName)"
          }

          if ($msixFiles.Count -eq 0) {
            Write-Error "No MSIX packages found!"
            exit 1
          }

      - name: Upload MSIX artifacts
        uses: actions/upload-artifact@v4
        with:
          name: msix-packages
          path: WalkThisWay/**/*.msix
          retention-days: 7

      - name: Upload MSIX packages to GitHub Release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $msixFiles = Get-ChildItem -Path "WalkThisWay" -Filter "*.msix" -Recurse

          foreach ($file in $msixFiles) {
            Write-Host "Uploading $($file.Name) to release..."
            gh release upload "${{ github.event.release.tag_name }}" "$($file.FullName)" --clobber
          }
